name: ci

"on":
  push:
    branches:
      - main
  pull_request_target:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gosleep-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' || github.ref != 'refs/heads/main' }}

jobs:
  rust:
    runs-on: >-
      ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && github.ref == 'refs/heads/main' && 'homelab' || 'homelab-pr-container' }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check free disk
        run: bash .gitea/workflows/ci-disk-check.sh 1536

      - name: Install Rust stable toolchain
        shell: bash
        run: bash .gitea/workflows/install-rust.sh

      - name: Cache Cargo registry and build
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: >-
            cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Check version consistency
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$package_version"
          test "$(cat VERSION)" = "$package_version"

      - name: Check formatting
        shell: bash
        run: cargo fmt --check

      - name: Run tests
        shell: bash
        run: cargo test --locked

      - name: Check local clock transitions
        shell: bash
        run: |
          TZ=Europe/Bratislava cargo test --locked \
            local_deadlines_handle_daylight_saving_transitions -- --ignored

      - name: Run clippy
        shell: bash
        run: cargo clippy --locked -- -D warnings

      - name: Build release binary
        shell: bash
        run: cargo build --release --locked

  lint-yaml:
    runs-on: >-
      ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && github.ref == 'refs/heads/main' && 'homelab' || 'homelab-pr-container' }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check free disk
        run: bash .gitea/workflows/ci-disk-check.sh 512

      - name: Lint YAML
        shell: bash
        run: |
          set -euo pipefail
          tools="$(mktemp -d "${RUNNER_TEMP:-/tmp}/gosleep-yamllint.XXXXXXXX")"
          trap 'rm -rf "$tools"' EXIT
          if ! python3 -c 'import venv, ensurepip' >/dev/null 2>&1; then
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends python3-venv
            rm -rf /var/lib/apt/lists/*
            apt-get clean
          fi
          python3 -m venv "$tools/venv"
          "$tools/venv/bin/pip" install --disable-pip-version-check --no-cache-dir yamllint==1.38.0
          "$tools/venv/bin/yamllint" -c .yamllint .
