name: ci

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: [self-hosted, linux, arch, homelab]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust stable toolchain
        shell: bash
        run: bash .gitea/workflows/install-rust.sh

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: >-
            cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Check version consistency
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(cargo metadata --no-deps --format-version 1)"
          package_version="$(jq -r '.packages[] | select(.name == "gosleep-timer") | .version' <<< "$metadata")"
          test -n "$package_version"
          test "$(cat VERSION)" = "$package_version"

      - name: Check formatting
        shell: bash
        run: cargo fmt --check

      - name: Run tests
        shell: bash
        run: cargo test --locked

      - name: Run clippy
        shell: bash
        run: cargo clippy --locked -- -D warnings

      - name: Build release binary
        shell: bash
        run: cargo build --release --locked

  lint-yaml:
    runs-on: [self-hosted, linux, arch, homelab]
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Lint YAML
        shell: bash
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            cytopia/yamllint:latest \
            -c .yamllint .
