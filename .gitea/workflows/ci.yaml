name: ci

"on":
  push:
    branches:
      - main
  pull_request_target:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gosleep-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' || github.ref != 'refs/heads/main' }}

jobs:
  rust:
    runs-on: >-
      ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && github.ref == 'refs/heads/main' && 'homelab' || 'homelab-pr-container' }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check free disk
        run: bash .gitea/workflows/ci-disk-check.sh 1536

      - name: Check and build Rust
        shell: bash
        env:
          CI_TRUSTED_BUILD: >-
            ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
                && github.ref == 'refs/heads/main' && '1' || '0' }}
        run: bash .gitea/workflows/run-rust.sh full

  lint-yaml:
    runs-on: >-
      ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && github.ref == 'refs/heads/main' && 'homelab' || 'homelab-pr-container' }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check free disk
        run: bash .gitea/workflows/ci-disk-check.sh 512

      - name: Prepare cached Python for YAML lint
        run: bash .gitea/workflows/setup-python.sh 3.12
      - name: Lint YAML
        shell: bash
        run: |
          uv pip install --python "$CI_PYTHON_ENV/bin/python" yamllint==1.38.0
          yamllint -c .yamllint .
