name: release

"on":
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gosleep-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: [self-hosted, linux, arch, homelab]
    timeout-minutes: 30
    container:
      image: node:22.23.3-bookworm
      options: --cpus=1 --memory=768m --pids-limit=512
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check free disk
        run: bash .gitea/workflows/ci-disk-check.sh 1536

      - name: Install Rust stable toolchain
        shell: bash
        run: bash .gitea/workflows/install-rust.sh

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: >-
            cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Check release tag and version files
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF##*/}"
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$package_version"
          test "$(cat VERSION)" = "$package_version"
          test "$tag" = "v${package_version}"

      - name: Check formatting
        shell: bash
        run: cargo fmt --check

      - name: Run tests
        shell: bash
        run: cargo test --locked

      - name: Check local clock transitions
        shell: bash
        run: |
          TZ=Europe/Bratislava cargo test --locked \
            local_deadlines_handle_daylight_saving_transitions -- --ignored

      - name: Run clippy
        shell: bash
        run: cargo clippy --locked -- -D warnings

  lint-yaml:
    runs-on: [self-hosted, linux, arch, homelab]
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Lint YAML in a temporary environment
        shell: bash
        run: |
          set -euo pipefail
          bash .gitea/workflows/ci-disk-check.sh 256
          tools="$(mktemp -d "${RUNNER_TEMP:-/tmp}/gosleep-yaml.XXXXXXXX")"
          trap 'rm -rf "$tools"' EXIT
          python3 -m venv "$tools/venv"
          "$tools/venv/bin/pip" install --disable-pip-version-check --no-cache-dir yamllint==1.38.0
          "$tools/venv/bin/yamllint" -c .yamllint .

  linux-amd64:
    needs: [verify, lint-yaml]
    runs-on: [self-hosted, linux, arch, homelab]
    timeout-minutes: 30
    container:
      image: node:22.23.3-bookworm
      options: --cpus=1 --memory=768m --pids-limit=512
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check free disk
        run: bash .gitea/workflows/ci-disk-check.sh 1536

      - name: Install release tools
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl jq

      - name: Install Rust stable toolchain
        shell: bash
        run: bash .gitea/workflows/install-rust.sh

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: >-
            cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Build release binary
        shell: bash
        run: cargo build --release --locked

      - name: Package artifact
        shell: bash
        run: |
          tag="${GITHUB_REF##*/}"
          version="${tag#v}"
          mkdir -p dist
          binary="gosleep-timer-${version}-linux-amd64"
          cp target/release/gosleep-timer "dist/${binary}"
          cd dist
          sha256sum "${binary}" > "${binary}.sha256"

      - name: Create Gitea release
        id: release
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          tag="${GITHUB_REF##*/}"
          release_url="https://git.forust.xyz/api/v1/repos/forust/gosleep/releases"
          existing="$(curl -fsS \
            "${release_url}/tags/${tag}" \
            -H "Authorization: token ${GITEA_TOKEN}")" || existing='{}'
          release_id="$(printf '%s' "$existing" | jq -r '.id // empty')"

          if [ -z "$release_id" ]; then
            body="$(cat <<EOF
          Release ${tag}

          See CHANGELOG.md for notable changes.
          EOF
            )"
            payload="$(jq -n \
              --arg tag "${tag}" \
              --arg commit "${GITHUB_SHA}" \
              --arg name "gosleep-timer ${tag}" \
              --arg body "$body" \
              '{tag_name: $tag, target_commitish: $commit, name: $name, body: $body, draft: false, prerelease: false}')"
            response="$(curl -fsS \
              -X POST "${release_url}" \
              -H "Authorization: token ${GITEA_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$payload")"
            release_id="$(printf '%s' "$response" | jq -r '.id')"
          fi

          test -n "$release_id" && test "$release_id" != "null"
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"

      - name: Upload Gitea release assets
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          release_url="https://git.forust.xyz/api/v1/repos/forust/gosleep/releases"
          release_id="${{ steps.release.outputs.release_id }}"
          for asset in dist/gosleep-timer-*; do
            name="$(basename "$asset")"
            release="$(curl -fsS \
              "${release_url}/${release_id}" \
              -H "Authorization: token ${GITEA_TOKEN}")"
            asset_id="$(printf '%s' "$release" | jq -r --arg name "$name" '.assets[]? | select(.name == $name) | .id' | head -n 1)"
            if [ -n "$asset_id" ]; then
              curl -fsS \
                -X DELETE "${release_url}/${release_id}/assets/${asset_id}" \
                -H "Authorization: token ${GITEA_TOKEN}"
            fi
            encoded="$(printf '%s' "$name" | jq -sRr @uri)"
            curl -fsS \
              -X POST "${release_url}/${release_id}/assets?name=${encoded}" \
              -H "Authorization: token ${GITEA_TOKEN}" \
              -F "attachment=@${asset}"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gosleep-timer-linux-amd64
          path: dist/*
