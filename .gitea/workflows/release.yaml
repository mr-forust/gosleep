name: release

"on":
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gosleep-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: workstation-build
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check free disk
        run: bash .gitea/workflows/ci-disk-check.sh 1536

      - name: Check release tag and version files
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF##*/}"
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$package_version"
          test "$(cat VERSION)" = "$package_version"
          test "$tag" = "v${package_version}"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Check Rust in the cached build environment
        env:
          CI_TRUSTED_BUILD: "1"
        run: bash .gitea/workflows/run-rust.sh verify

  lint-yaml:
    needs: verify
    runs-on: vps-light
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Prepare cached Python for YAML lint
        run: bash .gitea/workflows/setup-python.sh 3.12
      - name: Lint YAML
        run: |
          uv pip install --python "$CI_PYTHON_ENV/bin/python" yamllint==1.38.0
          yamllint -c .yamllint .

  linux-amd64:
    needs: [verify, lint-yaml]
    runs-on: workstation-build
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Check free disk
        run: bash .gitea/workflows/ci-disk-check.sh 1536

      - name: Install cached release tools
        run: bash .gitea/workflows/install-jq.sh
      - name: Build release binary in the cached build environment
        env:
          CI_TRUSTED_BUILD: "1"
        run: bash .gitea/workflows/run-rust.sh build

      - name: Package artifact
        shell: bash
        run: |
          tag="${GITHUB_REF##*/}"
          version="${tag#v}"
          mkdir -p dist
          binary="gosleep-timer-${version}-linux-amd64"
          cp target/release/gosleep-timer "dist/${binary}"
          cd dist
          sha256sum "${binary}" > "${binary}.sha256"

      - name: Create Gitea release
        id: release
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          tag="${GITHUB_REF##*/}"
          release_url="https://git.forust.xyz/api/v1/repos/forust/gosleep/releases"
          existing="$(curl -fsS \
            "${release_url}/tags/${tag}" \
            -H "Authorization: token ${GITEA_TOKEN}")" || existing='{}'
          release_id="$(printf '%s' "$existing" | jq -r '.id // empty')"

          if [ -z "$release_id" ]; then
            body="$(cat <<EOF
          Release ${tag}

          See CHANGELOG.md for notable changes.
          EOF
            )"
            payload="$(jq -n \
              --arg tag "${tag}" \
              --arg commit "${GITHUB_SHA}" \
              --arg name "gosleep-timer ${tag}" \
              --arg body "$body" \
              '{tag_name: $tag, target_commitish: $commit, name: $name, body: $body, draft: false, prerelease: false}')"
            response="$(curl -fsS \
              -X POST "${release_url}" \
              -H "Authorization: token ${GITEA_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$payload")"
            release_id="$(printf '%s' "$response" | jq -r '.id')"
          fi

          test -n "$release_id" && test "$release_id" != "null"
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"

      - name: Upload Gitea release assets
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          release_url="https://git.forust.xyz/api/v1/repos/forust/gosleep/releases"
          release_id="${{ steps.release.outputs.release_id }}"
          for asset in dist/gosleep-timer-*; do
            name="$(basename "$asset")"
            release="$(curl -fsS \
              "${release_url}/${release_id}" \
              -H "Authorization: token ${GITEA_TOKEN}")"
            asset_id="$(printf '%s' "$release" | jq -r --arg name "$name" '.assets[]? | select(.name == $name) | .id' | head -n 1)"
            if [ -n "$asset_id" ]; then
              curl -fsS \
                -X DELETE "${release_url}/${release_id}/assets/${asset_id}" \
                -H "Authorization: token ${GITEA_TOKEN}"
            fi
            encoded="$(printf '%s' "$name" | jq -sRr @uri)"
            curl -fsS \
              -X POST "${release_url}/${release_id}/assets?name=${encoded}" \
              -H "Authorization: token ${GITEA_TOKEN}" \
              -F "attachment=@${asset}"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gosleep-timer-linux-amd64
          path: dist/*
